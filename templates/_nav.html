<nav><div class="wrap">
  <a class="logo" href="{{ url_for('index') }}">♻️ <b>REBRAY</b></a>
  <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="navlinks"><span></span><span></span><span></span></button>
  <div class="navlinks" id="navlinks">
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('shop') }}">Shop</a>
    <div class="dd"><a href="{{ url_for('index') }}#tools">Tools ▾</a><div class="dd-menu">
      {% for slug, t in tools.items() %}<a href="{{ url_for('tool', slug=slug) }}">{{ t.title }}</a>{% endfor %}
    </div></div>
    <a href="{{ url_for('quote_page') }}">Hitung Harga</a>
    <a href="{{ url_for('cart') }}">Keranjang{% if g.user and cart_count %}<span class="badge">{{ cart_count }}</span>{% endif %}</a>
    <a href="{{ url_for('orders') }}">Pesanan</a>
    {% if g.user and g.user.is_admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
    {% if g.user %}
      <span class="me">{{ g.user.email }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="linkbtn" type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Daftar</a>
    {% endif %}
  </div>
</div></nav>
