<div class="prod{{ " reveal" if reveal }}"><a href="{{ url_for('product', slug=p.slug) }}"><div class="thumb">{% if p.photo %}<img src="{{ url_for('media', name=p.photo) }}" alt="{{ p.name }}" loading="lazy">{% else %}{{ p.emoji }}{% endif %}{% if p.model %}<span class="badge3d">🧊 3D</span>{% endif %}</div><div class="body"><h3>{{ p.name }}</h3><p>{{ p.description }}</p><div class="price">{% if p.price_idr %}{{ p.price_idr|rupiah }}{% else %}Harga menyesuaikan{% endif %}</div></div></a>{% if p.is_ready_stock %}<div class="actions">{% include "_market_btn.html" %}</div>{% endif %}</div>
