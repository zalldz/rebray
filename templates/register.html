{% extends "base.html" %}
{% block title %}Daftar — REBRAY{% endblock %}
{% block content %}
<form class="form-box" method="post">
  <div class="kicker">REGISTER</div>
  <h2>Buat Akun</h2>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label for="name">Nama</label>
  <input id="name" name="name" required autocomplete="name" value="{{ request.form.name }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email" value="{{ request.form.email }}">
  <label for="password">Password (min. 8 karakter)</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <button class="btn btn-primary" type="submit">Daftar</button>
  <p class="alt">Sudah punya akun? <a href="{{ url_for('login', next=request.args.next) }}">Login</a></p>
</form>
{% endblock %}
